<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 846" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" role="img" aria-label="x402 payment sequence diagram">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8.5,3 L0,6 Z" fill="#37352f"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="1039" height="845" rx="16" fill="#ffffff" stroke="#e7e5de"/>

  <!-- lifelines -->
  <g stroke="#bdbbb3" stroke-width="1" stroke-dasharray="3 4">
    <line x1="150" y1="86" x2="150" y2="764"/>
    <line x1="400" y1="86" x2="400" y2="764"/>
    <line x1="650" y1="86" x2="650" y2="764"/>
    <line x1="895" y1="86" x2="895" y2="764"/>
  </g>

  <!-- actor heads -->
  <g text-anchor="middle" font-size="15" font-weight="700" fill="#3a3417">
    <rect x="86"  y="48" width="128" height="38" rx="6" fill="#fbf4ce" stroke="#e4d27f"/>
    <text x="150" y="72">Buyer</text>
    <rect x="314" y="48" width="172" height="38" rx="6" fill="#fbf4ce" stroke="#e4d27f"/>
    <text x="400" y="72">Resource Server</text>
    <rect x="584" y="48" width="132" height="38" rx="6" fill="#fbf4ce" stroke="#e4d27f"/>
    <text x="650" y="72">Facilitator</text>
    <rect x="818" y="48" width="154" height="38" rx="6" fill="#fbf4ce" stroke="#e4d27f"/>
    <text x="895" y="72">Stellar network</text>
  </g>

  <!-- messages -->
  <g font-size="13.5" fill="#37352f" text-anchor="middle">
    <text x="275" y="126">Request protected resource</text>
    <line x1="152" y1="134" x2="394" y2="134" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="275" y="172">402 + payment requirements</text>
    <line x1="398" y1="180" x2="156" y2="180" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

    <rect x="74" y="208" width="152" height="46" rx="4" fill="#ededed" stroke="#cfcfcf"/>
    <text x="150" y="228" font-weight="700" font-size="13">Sign Soroban</text>
    <text x="150" y="244" font-size="12.5" fill="#444">authorization entry</text>

    <text x="275" y="278">Retry + signed payment payload</text>
    <line x1="152" y1="286" x2="394" y2="286" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="525" y="328">POST /verify</text>
    <line x1="402" y1="336" x2="644" y2="336" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="772" y="376">Simulate transaction</text>
    <line x1="652" y1="384" x2="889" y2="384" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="772" y="420">Simulation result</text>
    <line x1="893" y1="428" x2="656" y2="428" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

    <text x="525" y="466">Verified</text>
    <line x1="648" y1="474" x2="406" y2="474" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

    <rect x="302" y="498" width="196" height="46" rx="4" fill="#fbf1b8" stroke="#e0c94a"/>
    <text x="400" y="518" font-weight="700" font-size="13" fill="#3a3417">Run protected resource</text>
    <text x="400" y="534" font-size="12.5" fill="#5a5021">then determine success</text>

    <text x="525" y="566">POST /settle</text>
    <line x1="402" y1="574" x2="644" y2="574" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="772" y="610">Submit fee-sponsored transaction</text>
    <line x1="652" y1="618" x2="889" y2="618" stroke="#37352f" stroke-width="1.3" marker-end="url(#ah)"/>

    <text x="772" y="654">Confirmed + transaction hash</text>
    <line x1="893" y1="662" x2="656" y2="662" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

    <text x="525" y="700">Settlement result</text>
    <line x1="648" y1="708" x2="406" y2="708" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>

    <text x="275" y="744">200 + resource + payment response</text>
    <line x1="398" y1="752" x2="156" y2="752" stroke="#37352f" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#ah)"/>
  </g>

  <!-- caption -->
  <line x1="0" y1="794" x2="1040" y2="794" stroke="#e7e5de" stroke-width="1"/>
  <text x="34" y="824" font-size="13.5" fill="#6c6a63">Verification does not move funds. Settlement happens only after the protected resource succeeds.</text>
</svg>
